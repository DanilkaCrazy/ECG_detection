# Stage 3.6.17 — frozen-model independent assessment
seed: 42
frozen_model: E7 RF
dataset: data/processed/af_afl_stage3616
holdout:
  name: sealed_holdout
  use_for_selection: false
  metrics: [f1_macro, afib_f1, afl_f1, roc_auc, pr_auc, brier]
  bootstrap:
    resamples: 1000
    group: patient_key
    level: patient_for_ptbxl_record_for_chapman_cpsc
ptbxl_official_protocol:
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  test_folds: [9, 10]
  group_by: patient_id
  note: "folds 9/10 have additional human validation; n_test is very small"
limitations:
  - "PTB-XL has only 89 provenance-valid records after Stage 3.6.14"
  - "No expert cardiologist review yet (package prepared in Stage 3.6.14)"
