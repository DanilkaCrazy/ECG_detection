# Stage 3.6.13 — cross-dataset generalisation
seed: 42
features: data/processed/af_afl_stage34/features_advanced_expert.npy
pairs:
  - [chapman, ptbxl]
  - [chapman, cpsc2018_extra]
  - [ptbxl, chapman]
  - [cpsc2018_extra, chapman]
methods: [none, CORAL, MMD, DANN]
